# sync_tables.ini  –  configuration for sync_tables.py
# Edit all values before running.

[ssh]
host        = ssh.serverb.example.com   ; SSH host (or IP) for Server B
port        = 22
username    = ssh_user
# Provide ONE of key_file or password (key_file is recommended)
key_file    = ~/.ssh/id_rsa
# password  = secret

[remote_db]                             ; MySQL on Server B (reached through the tunnel)
host        = 127.0.0.1                 ; leave as 127.0.0.1 — traffic goes through the tunnel
port        = 3306
database    = remote_db_name
user        = db_user
password    = db_password

[local_db]                              ; MySQL on Server A (this machine)
host        = 127.0.0.1
port        = 3306
database    = local_db_name
user        = db_user
password    = db_password

[tables]
source_table = table1                   ; table on Server B to read from
target_table = table2                   ; table on Server A to write to
primary_key  = id                       ; comma-separated for composite PKs, e.g.: id, region_id
